<div class="cadastro">
  <!-- Todo o conteúdo do header, main e footer fica aqui dentro -->

    <header class="header-login">
      <h1>Preencha seus dados para cadastrar!</h1>
    </header>

    <main class="main-login">
      <h3>Crie sua conta!</h3>

      <form (ngSubmit)="cadastrar()">

      <label for="nome">Nome:</label>
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome"
        [(ngModel)]="nome"
        required
      />

      <label for="sobrenome">Sobrenome:</label>
      <input
        type="text"
        id="sobrenome"
        name="sobrenome"
        placeholder="Digite seu sobrenome"
        [(ngModel)]="sobrenome"
        required
      />

      <label for="data_nascimento">Data de nascimento:</label>
      <input
        type="date"
        id="data_nascimento"
        name="data_nascimento"
        [(ngModel)]="data_nascimento"
        required
      />

      <label for="email">E-mail:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        [(ngModel)]="email"
        required
      />

      <label for="CPF">CPF:</label>
      <input
        type="text"
        id="CPF"
        name="CPF"
        placeholder="Digite seu CPF"
        [(ngModel)]="CPF"
        required
      />

      <label for="senha">Senha:</label>
      <input
        type="password"
        id="senha"
        name="senha"
        placeholder="Crie uma senha"
        [(ngModel)]="senha"
        required
      />
      <br />

      <button type="submit" id="Entrar">
        <h4>Entrar</h4>
      </button>

      <p *ngIf="mensagemErro">{{ mensagemErro }}</p>

      </form>
      
    </main>
    <footer class="footer-login">
      <h4><img src="./assets/logo.jpg" alt="logo.png" />Ecommerce - 2026</h4>
      <h4>Colocar imagem ou descrição do site</h4>
    </footer>
</div>
