<div class="login">
  <!-- Todo o conteúdo do header, main e footer fica aqui dentro -->

    <header class="header-login">
      <h1>Seja bem vindo ao nosso Site!</h1>
    </header>

    <main class="main-login">
      <h3>Faça login para entrar!</h3>

      <label for="Login">Login: </label><br />
      <input
        type="password"
        name="Login"
        id="Login"
        placeholder="Digite o login"
      />
      <br />

      <label for="Senha">Senha: </label><br />
      <input
        type="password"
        name="Senha"
        id="Senha"
        placeholder="Digite a senha"
      />
      <br />

      <form action="ecommerce.html" method="GET">
        <input type="submit" id="Entrar" value="Entrar" routerLink="/ecommerce" />
      </form>
    </main>
    <footer class="footer-login">
      <h4><img src="./assets/logo.jpg" alt="logo.png" />Ecommerce - 2026</h4>
      <h4>Colocar imagem ou descrição do site</h4>
    </footer>
</div>
