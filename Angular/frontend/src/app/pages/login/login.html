<div class="login">
  <!-- Todo o conteúdo do header, main e footer fica aqui dentro -->

    <header class="header-login">
      <h1>Seja bem vindo ao nosso Site!</h1>
    </header>

    <main class="main-login">
      <h3>Faça login para entrar!</h3>

      <form (ngSubmit)="entrar()">

      <label for="email"><h4>E-mail:</h4> </label><br />
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Digite seu e-mail"
        [(ngModel)]="email"
        required
      />
      <br />

      <label for="senha"><h4>Senha:</h4> </label><br />
      <input
        type="password"
        name="senha"
        id="senha"
        placeholder="Digite sua senha"
        [(ngModel)]="senha"
        required
      />
      <br />

      <button type="submit" id="Entrar">
        <h4>Entrar</h4>
      </button>

      <p *ngIf="mensagemErro">{{ mensagemErro }}</p>

      </form>
      
    </main>
    <footer class="footer-login">
      <h4><img src="./assets/logo.jpg" alt="logo.png" />Ecommerce - 2026</h4>
      <h4>Colocar imagem ou descrição do site</h4>
    </footer>
</div>
